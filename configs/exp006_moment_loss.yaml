# ============================================================
# Experimento 006 — entrenamiento completo, MAE + MomentLoss (λ=0.001)
# Hereda exp002 (PSDM 2D, ganador de inputs). El sweep de λ (0.001/0.01/0.1)
# mostró val/dvh_score plano dentro del ruido en todo el rango y val/mae
# empeorando monótono con λ — ningún valor probó mejorar DVH. Se entrena
# λ=0.001 completo (el que menos degrada MAE) para tener la curva de
# convergencia real y ver en qué época (si alguna) el término de momentos
# deja de aportar gradiente útil (ver train/moment, val/moment en W&B).
# ============================================================

experiment:
  name: exp006_moment_loss
  description: "Entrenamiento completo MAE + MomentLoss (lambda=0.001), early stopping paciencia 30"
  seed: 42

# ----------------------- Datos -----------------------
data:
  processed_dir: "C:/Pablo/ProstateDoseProject/processed"
  splits_file: "data/splits/splits_v1.json"
  fold: 0

  inputs:
    use_ct: true
    use_body_mask: true
    use_ptv_mask: false
    use_bladder_mask: false
    use_rectum_mask: false
    use_psdm: true
    use_psdm_normalize_cm: 15.0

  z_margin_slices: 5
  inplane_size: 256

  batch_size: 1
  num_workers: 0
  pin_memory: false

  cache_train: false              # RAM insuficiente para cache (ver exp006 sweep, ~2GB libres)
  cache_val: false

# --------------------- Augmentation ---------------------
augmentation:
  flip_lr_prob: 0.5
  rotation_degrees: 0
  intensity_jitter_hu: 50

# ----------------------- Modelo -----------------------
model:
  arch: "unet2d"
  in_channels: 5             # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
  out_channels: 1
  base_features: 16
  depth: 4
  upsample_mode: "bilinear"
  dropout: 0.0

# ----------------------- Loss -----------------------
loss:
  mae_weight: 1.0
  use_moment_loss: true
  moment_weight: 0.001
  moment_structures:
    ptv: [1, 2, 10]
    bladder: [1, 2, 10]
    rectum: [1, 2, 10]

# --------------------- Optimizer ---------------------
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: "cosine"
  warmup_epochs: 5
  max_epochs: 200

# --------------------- Training ---------------------
training:
  max_epochs: 200
  precision: "16-mixed"
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stopping_patience: 30
  monitor_metric: "val/mae"
  monitor_mode: "min"

# --------------------- Logging ---------------------
logging:
  wandb_project: "prostate-dose-prediction"
  wandb_entity: null
  tags: ["loss:momentloss", "arch:unet2d", "inputs:psdm", "stage:6", "lambda:0.001", "final:true"]
  log_dvh_every_n_epochs: 5
  log_visual_every_n_epochs: 10
  num_visual_samples: 3

# --------------------- Constraints clínicos ---------------------
constraints:
  prescription_dose_gy: 78.0
  num_fractions: 39
  ptv:
    d95_target_pct: 100.0
  rectum:
    v70_max_pct: 25.0
    v65_max_pct: 35.0
    dmean_max_gy: null
  bladder:
    v70_max_pct: 35.0
    v65_max_pct: 50.0
    dmean_max_gy: null
