# ============================================================
# Experimento hipo 003c — DVH loss diferenciable, lambda mas chico aun (~lambda0/10)
# ============================================================
# Tercer intento de la serie DVH-loss. Resumen de los dos anteriores (ver
# CLAUDE_CODE_CONTEXT.md para el detalle completo):
#   - exp_hipo_003_dvhloss    (lambda0=50.94): NEGATIVO en las 4 varas.
#   - exp_hipo_003b_dvhloss_lambda10 (lambda0/5=10.0): recuperacion PARCIAL y
#     DESPAREJA — Bladder ya iguala o supera a 002b (mean|ΔV| media, MAE, AUC
#     BV65), pero Rectum queda con un residuo consistente (+2.6% mean|ΔV| media,
#     +8.2% MAE, AUC RV65/RV55 aun -0.05/-0.08 vs 002b). El conteo de casos
#     optimistas en no-cumple no bajo de 4/10 en ninguna de las dos corridas con
#     loss DVH (vs. 3/10 en 002b).
#
# Este config es IDENTICO a exp_hipo_003b_dvhloss_lambda10.yaml salvo
# `loss.dvh_weight`, bajado de 10.0 a 5.0 (pedido explicito de Pablo: "hacemos
# uno con lambda 5 [...] preparar con lambda 5 para todos"). Objetivo del
# resultado: ver si con lambda aun mas chico MEJORAN AMBAS estructuras (Rectum
# Y Bladder) o si SOLO mejora Rectum (y Bladder empieza a perder lo ganado) —
# eso decide si conviene seguir bajando lambda global o pasar a lambda
# DIFERENCIADO por estructura (Rectum != Bladder) en la loss.
#
# ⚠️ NO LANZAR hasta que la GPU este libre (en uso por otro proceso al momento
# de preparar este config, 2026-08-14 ~12:30 — ver CLAUDE_CODE_CONTEXT.md).
# Monitorear con nvidia-smi y lanzar cuando se libere.
#
# Todo lo demas (init, split, LR, horizonte, early stopping, dvh_sigmoid_k ya
# validado, dvh_structures) queda igual que en 003/003b para aislar el efecto
# del cambio de lambda.
# ============================================================

experiment:
  name: exp_hipo_003c_dvhloss_lambda5
  description: "DVH loss diferenciable (Nguyen 2020, sigmoide) con lambda=5 (~lambda0/10) tras recuperacion parcial/despareja de exp_hipo_003b_dvhloss_lambda10 (lambda=10)"
  seed: 42

# ----------------------- Datos -----------------------
data:
  processed_dir: "C:/Pablo/ProstateDoseProject/processed_hipo"
  splits_file: "data/splits/splits_hipo_v2_clean.json"
  fold: 0

  inputs:
    use_ct: true
    use_body_mask: true
    use_ptv_mask: false           # reemplazado por PSDM
    use_bladder_mask: false       # reemplazado por PSDM
    use_rectum_mask: false        # reemplazado por PSDM
    use_psdm: true                # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
    use_psdm_normalize_cm: 15.0

  z_margin_slices: 5
  inplane_size: 256

  batch_size: 1
  num_workers: 0
  pin_memory: false

  cache_train: false
  cache_val: false

# --------------------- Augmentation ---------------------
augmentation:
  flip_lr_prob: 0.5
  rotation_degrees: 0
  intensity_jitter_hu: 50

# ----------------------- Modelo -----------------------
model:
  arch: "unet2d"
  in_channels: 5             # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
  out_channels: 1
  base_features: 16
  depth: 4
  upsample_mode: "bilinear"
  dropout: 0.0
  context_slices: 3

# ----------------------- Loss -----------------------
# UNICO cambio respecto a exp_hipo_003b_dvhloss_lambda10.yaml: dvh_weight 10.0 -> 5.0.
loss:
  mae_weight: 1.0
  use_moment_loss: false
  moment_weight: 0.01
  moment_structures:
    ptv: [1, 2, 10]
    bladder: [1, 2, 10]
    rectum: [1, 2, 10]

  # --- DVH diferenciable (Nguyen et al. 2020, sigmoide, SIN adversarial) ---
  use_dvh_loss: true
  # dvh_weight = 5.0 (~lambda0/10) — pedido explicito tras la recuperacion
  # parcial/despareja de lambda=10 (Bladder ya OK, Rectum con residuo). Sigue
  # siendo GLOBAL (misma lambda para las 3 estructuras) — si este resultado
  # muestra que Rectum mejora pero Bladder empieza a empeorar, el proximo paso
  # es lambda DIFERENCIADO por estructura, no seguir bajando el global.
  dvh_weight: 5.0
  # dvh_sigmoid_k: sin cambios, ya validado (sesgo <0.5pp en las 3 estructuras,
  # ver results/calibracion_dvh_loss.json / CLAUDE_CODE_CONTEXT.md).
  dvh_sigmoid_k: 4.394
  # Muestreo de D (%Rx), concentrado en el hombro, no en el plateau bajo.
  dvh_structures:
    ptv:
      d_min_pct: 90.0
      d_max_pct: 107.0
      d_step_pct: 1.0
    rectum:
      d_min_pct: 40.0
      d_max_pct: 95.0
      d_step_pct: 2.5
    bladder:
      d_min_pct: 40.0
      d_max_pct: 95.0
      d_step_pct: 2.5

# --------------------- Optimizer ---------------------
optimizer:
  name: "adamw"
  lr: 1.0e-5           # identico a 002b/003/003b — full finetune sin destruir el prior de PTV
  weight_decay: 1.0e-5

scheduler:
  name: "cosine"
  warmup_epochs: 5   # nota: no esta conectado en configure_optimizers() (dead config, ver lightning_module.py)
  max_epochs: 100     # identico a 002b/003/003b

# --------------------- Training ---------------------
training:
  max_epochs: 100
  precision: "16-mixed"
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stopping_patience: 30   # identico a corridas anteriores (automatico); ademas monitoreo manual cada 5 epochs
  monitor_metric: "val/mae"
  monitor_mode: "min"

# --------------------- Logging ---------------------
logging:
  wandb_project: "prostate-dose-prediction"
  wandb_entity: null
  log_dvh_every_n_epochs: 5
  log_visual_every_n_epochs: 10
  num_visual_samples: 3

# --------------------- Constraints clínicos (hipofraccionado) ---------------------
# Identico a corridas anteriores — ver esos configs para el racional completo.
constraints:
  prescription_dose_gy: 70.0
  num_fractions: 28
  ptv:
    d95_target_pct: 100.0
  rectum:
    v70_max_pct: null
    v65_max_pct: 15.0
    v55_max_pct: 25.0
    v45_max_pct: 45.0
    dmean_max_gy: 40.0   # solo registro
  bladder:
    v70_max_pct: null
    v65_max_pct: 15.0
    v55_max_pct: 25.0
    v45_max_pct: 45.0
    dmean_max_gy: 40.0   # solo registro
