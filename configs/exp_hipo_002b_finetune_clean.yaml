# ============================================================
# Experimento hipo 002b — fine-tuning desde exp002 (normo), DATASET LIMPIO
# ============================================================
# Copia de exp_hipo_002_finetune.yaml, apuntada a splits_hipo_v2_clean.json (151
# pacientes, tras excluir 28 con contaminacion nodal pelvica — ver
# scripts/filter_hipofx_clean.py y CLAUDE_CODE_CONTEXT.md). Arquitectura, inputs,
# loss, optimizador, batch/augmentation/datos IDENTICOS al finetune original.
#
#   - Init: TODOS los pesos de checkpoints/exp002_unet2d_psdm/epoch=191.ckpt
#     (via --init-weights, carga SOLO el state_dict del modelo).
#   - LR = 1e-5 (LR exp002 / 10). Full finetune, sin freezing.
#   - Horizonte corto: max_epochs=100, IDENTICO al run original — NO necesita el
#     factor de escala de la Tarea 3 (parte de un init ya bueno de exp002, no
#     entrena desde cero, así que el argumento de "mismos updates de gradiente
#     totales que el baseline desde cero" no aplica aquí).
#   - early_stopping_patience=30 (guarda contra sobreajuste, igual al original).
#
# Ver CLAUDE_CODE_CONTEXT.md / HIPOFX_KICKOFF.md.
# ============================================================

experiment:
  name: exp_hipo_002b_finetune_clean
  description: "Fine-tuning hipofraccionado dataset LIMPIO (151 pac) desde exp002 (normo): full finetune, LR=1e-5, horizonte corto (100 epochs)"
  seed: 42

# ----------------------- Datos -----------------------
data:
  processed_dir: "C:/Pablo/ProstateDoseProject/processed_hipo"
  splits_file: "data/splits/splits_hipo_v2_clean.json"
  fold: 0

  inputs:
    use_ct: true
    use_body_mask: true
    use_ptv_mask: false           # reemplazado por PSDM
    use_bladder_mask: false       # reemplazado por PSDM
    use_rectum_mask: false        # reemplazado por PSDM
    use_psdm: true                # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
    use_psdm_normalize_cm: 15.0

  z_margin_slices: 5
  inplane_size: 256

  batch_size: 1
  num_workers: 0
  pin_memory: false

  cache_train: false
  cache_val: false

# --------------------- Augmentation ---------------------
augmentation:
  flip_lr_prob: 0.5
  rotation_degrees: 0
  intensity_jitter_hu: 50

# ----------------------- Modelo -----------------------
model:
  arch: "unet2d"
  in_channels: 5             # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
  out_channels: 1
  base_features: 16
  depth: 4
  upsample_mode: "bilinear"
  dropout: 0.0
  context_slices: 3

# ----------------------- Loss -----------------------
loss:
  mae_weight: 1.0
  use_moment_loss: false
  moment_weight: 0.01
  moment_structures:
    ptv: [1, 2, 10]
    bladder: [1, 2, 10]
    rectum: [1, 2, 10]

# --------------------- Optimizer ---------------------
optimizer:
  name: "adamw"
  lr: 1.0e-5           # LR_exp002 (1e-4) / 10 — full finetune sin destruir el prior de PTV
  weight_decay: 1.0e-5

scheduler:
  name: "cosine"
  warmup_epochs: 5   # nota: no está conectado en configure_optimizers() (dead config, ver lightning_module.py)
  max_epochs: 100     # horizonte REAL de este run — self-consistent. Igual al finetune
                      # original (no requiere el factor de escala de Tarea 3, parte de
                      # init ya bueno de exp002, no entrena desde cero).

# --------------------- Training ---------------------
training:
  max_epochs: 100
  precision: "16-mixed"
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stopping_patience: 30   # guarda contra sobreajuste (98 casos de train, init ya bueno)
  monitor_metric: "val/mae"
  monitor_mode: "min"

# --------------------- Logging ---------------------
logging:
  wandb_project: "prostate-dose-prediction"
  wandb_entity: null
  log_dvh_every_n_epochs: 5
  log_visual_every_n_epochs: 10
  num_visual_samples: 3

# --------------------- Constraints clínicos (hipofraccionado) ---------------------
# Protocolo: 70 Gy / 28 fx (2.5 Gy/fx). Constraints operativos con señal suficiente
# (ver D5, CLAUDE_CODE_CONTEXT.md): Rectum V65<15 / V55<25, Bladder V65<15.
# V45 (ambos OAR) y Dmean son de solo registro, no clasificación — ver evaluate_hipo.py,
# que además calibra el punto de operación en val, congelado, y no usa este bloque
# directamente (constraints hardcoded ahí para trazabilidad del criterio D5).
constraints:
  prescription_dose_gy: 70.0
  num_fractions: 28
  ptv:
    d95_target_pct: 100.0
  rectum:
    v70_max_pct: null
    v65_max_pct: 15.0
    v55_max_pct: 25.0
    v45_max_pct: 45.0
    dmean_max_gy: 40.0   # solo registro
  bladder:
    v70_max_pct: null
    v65_max_pct: 15.0
    v55_max_pct: 25.0
    v45_max_pct: 45.0
    dmean_max_gy: 40.0   # solo registro
