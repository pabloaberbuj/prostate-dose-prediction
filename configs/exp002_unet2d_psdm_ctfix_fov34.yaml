# ============================================================
# Experimento 002 (ctfix, FOV 34cm) — decision de pipeline.
#
# exp002_unet2d_psdm_ctfix (FOV 50cm, 1.953mm/px) confirmo que el CT real no aporta
# senal sobre el PSDM (MAE ~igual al pipeline con CT corrupto), y el DVH score empeoro
# levemente (1.39 vs 1.15 del pipeline viejo), atribuido a la resolucion mas gruesa de
# la caja de 50cm (BODY completo, pero OARs con menos resolucion efectiva).
#
# Esta corrida prueba una caja mas chica (34cm, 1.328mm/px, ~lado del pipeline viejo)
# que recorta el BODY casi siempre (ya sabemos que no aporta) para recuperar resolucion
# sobre PTV/Rectum/Bladder. Criterio de exito: DVH score vuelve a ~1.15.
#
# Ver CLAUDE_CODE_CONTEXT.md / memoria del proyecto para el detalle completo.
# ============================================================

experiment:
  name: exp002_unet2d_psdm_ctfix_fov34
  description: "Decision de FOV: mismo exp002_ctfix pero con caja de recorte de 34cm (1.328mm/px) en vez de 50cm"
  seed: 42

# ----------------------- Datos -----------------------
data:
  processed_dir: "C:/Pablo/ProstateDoseProject/processed_ctfix_34"
  splits_file: "data/splits/splits_v1.json"
  fold: 0

  inputs:
    use_ct: true
    use_body_mask: true
    use_ptv_mask: false           # reemplazado por PSDM
    use_bladder_mask: false       # reemplazado por PSDM
    use_rectum_mask: false        # reemplazado por PSDM
    use_psdm: true                # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
    use_psdm_normalize_cm: 15.0

  z_margin_slices: 5
  inplane_size: 256

  batch_size: 1
  num_workers: 0
  pin_memory: false

  cache_train: false
  cache_val: false

# --------------------- Augmentation ---------------------
augmentation:
  flip_lr_prob: 0.5
  rotation_degrees: 0
  intensity_jitter_hu: 50

# ----------------------- Modelo -----------------------
model:
  arch: "unet2d"
  in_channels: 5             # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
  out_channels: 1
  base_features: 16
  depth: 4
  upsample_mode: "bilinear"
  dropout: 0.0
  context_slices: 3

# ----------------------- Loss -----------------------
loss:
  mae_weight: 1.0
  use_moment_loss: false
  moment_weight: 0.01
  moment_structures:
    ptv: [1, 2, 10]
    bladder: [1, 2, 10]
    rectum: [1, 2, 10]

# --------------------- Optimizer ---------------------
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: "cosine"
  warmup_epochs: 5
  max_epochs: 200

# --------------------- Training ---------------------
training:
  max_epochs: 200
  precision: "16-mixed"
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stopping_patience: 30
  monitor_metric: "val/mae"
  monitor_mode: "min"

# --------------------- Logging ---------------------
logging:
  wandb_project: "prostate-dose-prediction"
  wandb_entity: null
  tags: ["ctfix:true", "fov:34cm", "inputs:psdm", "arch:unet2d", "baseline:ctfix_fov34"]
  log_dvh_every_n_epochs: 5
  log_visual_every_n_epochs: 10
  num_visual_samples: 3

# --------------------- Constraints clínicos ---------------------
constraints:
  prescription_dose_gy: 78.0
  num_fractions: 39
  ptv:
    d95_target_pct: 100.0
  rectum:
    v70_max_pct: 25.0
    v65_max_pct: 35.0
    dmean_max_gy: null
  bladder:
    v70_max_pct: 35.0
    v65_max_pct: 50.0
    dmean_max_gy: null
