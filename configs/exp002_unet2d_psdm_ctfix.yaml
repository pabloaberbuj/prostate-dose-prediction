# ============================================================
# Experimento 002 (ctfix) — misma arquitectura/config que exp002_unet2d_psdm,
# corriendo sobre la nueva linea base con CT real (bug de cargar_ct() arreglado,
# recorte en el plano de 50cm centrado en centroide PTV, 1.953mm/px isotropico).
# No es comparacion limpia contra exp002 original: cambia CT + FOV + resolucion,
# no solo el input. exp002 original queda como referencia historica.
# Ver CLAUDE_CODE_CONTEXT.md / memoria del proyecto para el detalle del fix.
# ============================================================

experiment:
  name: exp002_unet2d_psdm_ctfix
  description: "Nueva linea base: mismo exp002 (PSDM) pero con CT real + recorte 50cm (bug de cargar_ct() arreglado)"
  seed: 42

# ----------------------- Datos -----------------------
data:
  processed_dir: "C:/Pablo/ProstateDoseProject/processed_ctfix"
  splits_file: "data/splits/splits_v1.json"
  fold: 0

  inputs:
    use_ct: true
    use_body_mask: true
    use_ptv_mask: false           # reemplazado por PSDM
    use_bladder_mask: false       # reemplazado por PSDM
    use_rectum_mask: false        # reemplazado por PSDM
    use_psdm: true                # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
    use_psdm_normalize_cm: 15.0

  z_margin_slices: 5
  inplane_size: 256

  batch_size: 1
  num_workers: 0
  pin_memory: false

  cache_train: false
  cache_val: false

# --------------------- Augmentation ---------------------
augmentation:
  flip_lr_prob: 0.5
  rotation_degrees: 0
  intensity_jitter_hu: 50

# ----------------------- Modelo -----------------------
model:
  arch: "unet2d"
  in_channels: 5             # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
  out_channels: 1
  base_features: 16
  depth: 4
  upsample_mode: "bilinear"
  dropout: 0.0
  context_slices: 3

# ----------------------- Loss -----------------------
loss:
  mae_weight: 1.0
  use_moment_loss: false
  moment_weight: 0.01
  moment_structures:
    ptv: [1, 2, 10]
    bladder: [1, 2, 10]
    rectum: [1, 2, 10]

# --------------------- Optimizer ---------------------
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: "cosine"
  warmup_epochs: 5
  max_epochs: 200

# --------------------- Training ---------------------
training:
  max_epochs: 200
  precision: "16-mixed"
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stopping_patience: 30
  monitor_metric: "val/mae"
  monitor_mode: "min"

# --------------------- Logging ---------------------
logging:
  wandb_project: "prostate-dose-prediction"
  wandb_entity: null
  tags: ["ctfix:true", "fov:50cm", "inputs:psdm", "arch:unet2d", "baseline:ctfix_v1"]
  log_dvh_every_n_epochs: 5
  log_visual_every_n_epochs: 10
  num_visual_samples: 3

# --------------------- Constraints clínicos ---------------------
constraints:
  prescription_dose_gy: 78.0
  num_fractions: 39
  ptv:
    d95_target_pct: 100.0
  rectum:
    v70_max_pct: 25.0
    v65_max_pct: 35.0
    dmean_max_gy: null
  bladder:
    v70_max_pct: 35.0
    v65_max_pct: 50.0
    dmean_max_gy: null
