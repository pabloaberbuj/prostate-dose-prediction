# ============================================================
# Experimento 006 — sweep de λ para MomentLoss (λ=1.0)
# Hereda exp002 (PSDM 2D, ganador de inputs). Loss = MAE + λ·MomentLoss
# sobre PTV+Rectum+Bladder (M1, M2, M10). 40 epochs, sin early stopping,
# para comparar los 4 λ al mismo punto de entrenamiento.
# ============================================================

experiment:
  name: exp006_sweep_lambda1
  description: "Sweep MomentLoss: lambda=1.0 (impacto esperado dominante, ~10x el MAE)"
  seed: 42

# ----------------------- Datos -----------------------
data:
  processed_dir: "C:/Pablo/ProstateDoseProject/processed"
  splits_file: "data/splits/splits_v1.json"
  fold: 0

  inputs:
    use_ct: true
    use_body_mask: true
    use_ptv_mask: false
    use_bladder_mask: false
    use_rectum_mask: false
    use_psdm: true
    use_psdm_normalize_cm: 15.0

  z_margin_slices: 5
  inplane_size: 256

  batch_size: 1
  num_workers: 0
  pin_memory: false

  cache_train: false              # revertido: 19.5GB de cache deja <2GB libres de RAM y genera swapping
  cache_val: false

# --------------------- Augmentation ---------------------
augmentation:
  flip_lr_prob: 0.5
  rotation_degrees: 0
  intensity_jitter_hu: 50

# ----------------------- Modelo -----------------------
model:
  arch: "unet2d"
  in_channels: 5             # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
  out_channels: 1
  base_features: 16
  depth: 4
  upsample_mode: "bilinear"
  dropout: 0.0

# ----------------------- Loss -----------------------
loss:
  mae_weight: 1.0
  use_moment_loss: true
  moment_weight: 1.0
  moment_structures:
    ptv: [1, 2, 10]
    bladder: [1, 2, 10]
    rectum: [1, 2, 10]

# --------------------- Optimizer ---------------------
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: "cosine"
  warmup_epochs: 5
  max_epochs: 200

# --------------------- Training ---------------------
training:
  max_epochs: 40
  precision: "16-mixed"
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stopping_patience: 40     # >= max_epochs => no dispara dentro del sweep
  monitor_metric: "val/mae"
  monitor_mode: "min"

# --------------------- Logging ---------------------
logging:
  wandb_project: "prostate-dose-prediction"
  wandb_entity: null
  tags: ["loss:momentloss", "arch:unet2d", "inputs:psdm", "stage:6", "lambda:1.0"]
  log_dvh_every_n_epochs: 5
  log_visual_every_n_epochs: 10
  num_visual_samples: 3

# --------------------- Constraints clínicos ---------------------
constraints:
  prescription_dose_gy: 78.0
  num_fractions: 39
  ptv:
    d95_target_pct: 100.0
  rectum:
    v70_max_pct: 25.0
    v65_max_pct: 35.0
    dmean_max_gy: null
  bladder:
    v70_max_pct: 35.0
    v65_max_pct: 50.0
    dmean_max_gy: null
