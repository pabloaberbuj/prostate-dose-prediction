# ============================================================
# Experimento hipo 003b — DVH loss diferenciable, lambda reducido (lambda0/5)
# ============================================================
# Segundo intento de la serie DVH-loss. exp_hipo_003_dvhloss (lambda0=50.94,
# calibrado por balance de MAGNITUD de gradiente al init) dio resultado NEGATIVO:
# empeoro mean|ΔV| banda media de Rectum (+8.9%), empeoro MAE espacial en las 4
# estructuras (Rectum +17%), rompio AUC de RV65/RV55, y subio el conteo de casos
# optimistas en no-cumple (3->4/10) — ver CLAUDE_CODE_CONTEXT.md, seccion
# "exp_hipo_003_dvhloss — PRIMER INTENTO". Diagnostico: lambda0 domino la
# optimizacion una vez L_MAE se achico durante el entrenamiento (L_DVH no se
# achica al mismo ritmo, al ser una loss de forma, no de error absoluto).
#
# Este config es IDENTICO a exp_hipo_003_dvhloss.yaml salvo `loss.dvh_weight`,
# bajado a lambda0/5 = 50.94/5 = 10.0 (pedido explicito: "avancemos con
# lambda/5=10"). Todo lo demas (init, split, LR, horizonte, early stopping,
# dvh_sigmoid_k ya validado, dvh_structures) queda igual para aislar el efecto
# del cambio de lambda.
#
# Monitoreo: se corre con seguimiento manual cada 5 epochs (scripts/watch_lambda_run.py
# sobre checkpoints/exp_hipo_003b_dvhloss_lambda10/last.ckpt) para decidir si hace
# falta una reduccion mas agresiva de lambda ANTES de esperar el early stopping
# automatico (que tardaria ~1-3.5h como las corridas anteriores).
# ============================================================

experiment:
  name: exp_hipo_003b_dvhloss_lambda10
  description: "DVH loss diferenciable (Nguyen 2020, sigmoide) con lambda=10 (=lambda0/5) tras resultado negativo de exp_hipo_003_dvhloss a lambda0=50.94"
  seed: 42

# ----------------------- Datos -----------------------
data:
  processed_dir: "C:/Pablo/ProstateDoseProject/processed_hipo"
  splits_file: "data/splits/splits_hipo_v2_clean.json"
  fold: 0

  inputs:
    use_ct: true
    use_body_mask: true
    use_ptv_mask: false           # reemplazado por PSDM
    use_bladder_mask: false       # reemplazado por PSDM
    use_rectum_mask: false        # reemplazado por PSDM
    use_psdm: true                # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
    use_psdm_normalize_cm: 15.0

  z_margin_slices: 5
  inplane_size: 256

  batch_size: 1
  num_workers: 0
  pin_memory: false

  cache_train: false
  cache_val: false

# --------------------- Augmentation ---------------------
augmentation:
  flip_lr_prob: 0.5
  rotation_degrees: 0
  intensity_jitter_hu: 50

# ----------------------- Modelo -----------------------
model:
  arch: "unet2d"
  in_channels: 5             # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
  out_channels: 1
  base_features: 16
  depth: 4
  upsample_mode: "bilinear"
  dropout: 0.0
  context_slices: 3

# ----------------------- Loss -----------------------
# UNICO cambio respecto a exp_hipo_003_dvhloss.yaml: dvh_weight 50.94 -> 10.0.
loss:
  mae_weight: 1.0
  use_moment_loss: false
  moment_weight: 0.01
  moment_structures:
    ptv: [1, 2, 10]
    bladder: [1, 2, 10]
    rectum: [1, 2, 10]

  # --- DVH diferenciable (Nguyen et al. 2020, sigmoide, SIN adversarial) ---
  use_dvh_loss: true
  # dvh_weight = lambda0/5 = 50.94/5 = 10.0 — pedido explicito tras el resultado
  # negativo de exp_hipo_003_dvhloss (lambda0 completo domino la optimizacion).
  # NO recalibrado desde cero (lambda0 sigue siendo el punto de referencia de
  # magnitud, esto es una reduccion pragmatica, no una nueva calibracion).
  dvh_weight: 10.0
  # dvh_sigmoid_k: sin cambios, ya validado (sesgo <0.5pp en las 3 estructuras,
  # ver results/calibracion_dvh_loss.json / CLAUDE_CODE_CONTEXT.md).
  dvh_sigmoid_k: 4.394
  # Muestreo de D (%Rx), concentrado en el hombro, no en el plateau bajo.
  dvh_structures:
    ptv:
      d_min_pct: 90.0
      d_max_pct: 107.0
      d_step_pct: 1.0
    rectum:
      d_min_pct: 40.0
      d_max_pct: 95.0
      d_step_pct: 2.5
    bladder:
      d_min_pct: 40.0
      d_max_pct: 95.0
      d_step_pct: 2.5

# --------------------- Optimizer ---------------------
optimizer:
  name: "adamw"
  lr: 1.0e-5           # identico a 002b/003 — full finetune sin destruir el prior de PTV
  weight_decay: 1.0e-5

scheduler:
  name: "cosine"
  warmup_epochs: 5   # nota: no esta conectado en configure_optimizers() (dead config, ver lightning_module.py)
  max_epochs: 100     # identico a 002b/003

# --------------------- Training ---------------------
training:
  max_epochs: 100
  precision: "16-mixed"
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stopping_patience: 30   # identico a 002b/003 (automatico); ademas se monitorea manualmente cada 5 epochs
  monitor_metric: "val/mae"
  monitor_mode: "min"

# --------------------- Logging ---------------------
logging:
  wandb_project: "prostate-dose-prediction"
  wandb_entity: null
  log_dvh_every_n_epochs: 5
  log_visual_every_n_epochs: 10
  num_visual_samples: 3

# --------------------- Constraints clínicos (hipofraccionado) ---------------------
# Identico a 002b/003 — ver esos configs para el racional completo.
constraints:
  prescription_dose_gy: 70.0
  num_fractions: 28
  ptv:
    d95_target_pct: 100.0
  rectum:
    v70_max_pct: null
    v65_max_pct: 15.0
    v55_max_pct: 25.0
    v45_max_pct: 45.0
    dmean_max_gy: 40.0   # solo registro
  bladder:
    v70_max_pct: null
    v65_max_pct: 15.0
    v55_max_pct: 25.0
    v45_max_pct: 45.0
    dmean_max_gy: 40.0   # solo registro
