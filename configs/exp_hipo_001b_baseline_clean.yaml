# ============================================================
# Experimento hipo 001b — baseline U-Net 2D + PSDM, desde cero, DATASET LIMPIO
# ============================================================
# Copia de exp_hipo_001_baseline.yaml, apuntada a splits_hipo_v2_clean.json (151
# pacientes, tras excluir 28 con contaminacion nodal pelvica — ver
# scripts/filter_hipofx_clean.py y CLAUDE_CODE_CONTEXT.md, seccion "Contaminacion
# nodal"). Arquitectura, inputs, loss, optimizador y augmentation quedan IDENTICOS
# al baseline original. Entrenamiento desde cero (init random).
#
# Factor de escala de epocas RECALCULADO (Tarea 3, no reusar 0.44/2.28 del run
# viejo): train_normo(265) / train_hipo_nuevo(98) = 2.7041 (antes 265/116=2.2845).
# Logica: mantener constante el numero total de updates de gradiente respecto al
# horizonte de exp002 (200 epocas x 265 pacientes / batch=1), no el numero de
# epocas nominal — con menos pacientes por epoca hace falta mas epocas para
# el mismo presupuesto de pasos. Redondeo a la decena mas cercana, misma
# convencion que el run original (200*2.2845=456.9->460, 30*2.2845=68.5->70).
#   max_epochs:              200 * 2.7041 = 540.8 -> 540
#   early_stopping_patience:  30 * 2.7041 =  81.1 -> 80
# scheduler.max_epochs = 540, self-consistent con max_epochs real de este run.
#
# Ver CLAUDE_CODE_CONTEXT.md / HIPOFX_KICKOFF.md.
# ============================================================

experiment:
  name: exp_hipo_001b_baseline_clean
  description: "Baseline hipofraccionado dataset LIMPIO (151 pac, sin contaminacion nodal): U-Net 2D + PSDM, desde cero"
  seed: 42

# ----------------------- Datos -----------------------
data:
  processed_dir: "C:/Pablo/ProstateDoseProject/processed_hipo"
  splits_file: "data/splits/splits_hipo_v2_clean.json"
  fold: 0

  inputs:
    use_ct: true
    use_body_mask: true
    use_ptv_mask: false           # reemplazado por PSDM
    use_bladder_mask: false       # reemplazado por PSDM
    use_rectum_mask: false        # reemplazado por PSDM
    use_psdm: true                # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
    use_psdm_normalize_cm: 15.0

  z_margin_slices: 5
  inplane_size: 256

  batch_size: 1
  num_workers: 0
  pin_memory: false

  cache_train: false
  cache_val: false

# --------------------- Augmentation ---------------------
augmentation:
  flip_lr_prob: 0.5
  rotation_degrees: 0
  intensity_jitter_hu: 50

# ----------------------- Modelo -----------------------
model:
  arch: "unet2d"
  in_channels: 5             # CT + BODY + PSDM_PTV + PSDM_Rectum + PSDM_Bladder
  out_channels: 1
  base_features: 16
  depth: 4
  upsample_mode: "bilinear"
  dropout: 0.0
  context_slices: 3

# ----------------------- Loss -----------------------
loss:
  mae_weight: 1.0
  use_moment_loss: false
  moment_weight: 0.01
  moment_structures:
    ptv: [1, 2, 10]
    bladder: [1, 2, 10]
    rectum: [1, 2, 10]

# --------------------- Optimizer ---------------------
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: "cosine"
  warmup_epochs: 5   # nota: no está conectado en configure_optimizers() (dead config, ver lightning_module.py)
  max_epochs: 540     # escalado x2.7041 (=265/98, train normo/train_hipo_clean) respecto a
                      # exp002 (200) — recalculado en Tarea 3, NO reusar el factor 2.28 del
                      # run sobre el dataset contaminado.

# --------------------- Training ---------------------
training:
  max_epochs: 540
  precision: "16-mixed"
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  early_stopping_patience: 80   # escalado x2.7041 igual que scheduler.max_epochs
  monitor_metric: "val/mae"
  monitor_mode: "min"

# --------------------- Logging ---------------------
logging:
  wandb_project: "prostate-dose-prediction"
  wandb_entity: null
  log_dvh_every_n_epochs: 5
  log_visual_every_n_epochs: 10
  num_visual_samples: 3

# --------------------- Constraints clínicos (hipofraccionado) ---------------------
# Protocolo: 70 Gy / 28 fx (2.5 Gy/fx). Constraints operativos con señal suficiente
# (ver D5, CLAUDE_CODE_CONTEXT.md): Rectum V65<15 / V55<25, Bladder V65<15.
# V45 (ambos OAR) y Dmean son de solo registro, no clasificación — ver evaluate_hipo.py,
# que además calibra el punto de operación en val, congelado, y no usa este bloque
# directamente (constraints hardcoded ahí para trazabilidad del criterio D5).
constraints:
  prescription_dose_gy: 70.0
  num_fractions: 28
  ptv:
    d95_target_pct: 100.0
  rectum:
    v70_max_pct: null
    v65_max_pct: 15.0
    v55_max_pct: 25.0
    v45_max_pct: 45.0
    dmean_max_gy: 40.0   # solo registro
  bladder:
    v70_max_pct: null
    v65_max_pct: 15.0
    v55_max_pct: 25.0
    v45_max_pct: 45.0
    dmean_max_gy: 40.0   # solo registro
